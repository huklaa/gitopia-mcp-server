version: 2

project_name: gitopia-mcp-server

builds:
  - main: ./cmd/server
    binary: gitopia-mcp-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto

mcp:
  name: io.github.gitopia/gitopia-mcp-server
  title: "Gitopia MCP Server"
  description: "Decentralized Git with on-chain governance, bounties, and DAOs. Tools for repos, issues, PRs, labels, releases, bounties, and DAO proposals. Auto-wallet on first use, trust tiers, and approval mode for human-in-the-loop."
  homepage: "https://gitopia.com"
  auth:
    type: github-oidc
  repository:
    url: "https://github.com/gitopia/gitopia-mcp-server"
    source: github
    id: "1199353361"
  packages:
    - registry_type: oci
      identifier: "ghcr.io/gitopia/gitopia-mcp-server:{{ .Version }}"
      transport:
        type: stdio
